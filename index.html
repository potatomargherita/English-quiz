<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LEAP QUIZ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- ==================== -->
        <!-- タイトル -->
        <!-- ==================== -->

        <h1>LEAP QUIZ</h1>


        <!-- ==================== -->
        <!-- ロード画面 -->
        <!-- ==================== -->

        <div id="loading-screen" class="quiz-box">

            <h2>Loading...</h2>

            <p>単語データを読み込んでいます</p>

        </div>


        <!-- ==================== -->
<!-- HOME画面 -->
<!-- ==================== -->

<div id="home-screen" class="quiz-box" style="display: none;">

    <h2>HOME</h2>

    <p>教材を選択してください</p>

    <button id="leap-button">
        LEAP
    </button>

</div>

<!-- ==================== -->
<!-- LEAP HOME画面 -->
<!-- ==================== -->

<div id="leap-home-screen" class="quiz-box" style="display: none;">

    <h2>LEAP</h2>

    <p>メニューを選択してください</p>

    <button id="leap-test-button">
        TEST
    </button>

    <button id="leap-list-button">
        LIST
    </button>

    <button id="leap-status-button">
        STATUS
    </button>

    <button id="leap-weak-button">
        WEAK TEST
    </button>

</div>

<!-- ==================== -->
<!-- QUIZ SETTINGS -->
<!-- ==================== -->

<div
    id="quiz-settings-screen"
    class="quiz-box"
    style="display: none;"
>

    <h2 id="settings-title">TEST</h2>

    <p id="settings-description">
        出題範囲を設定してください
    </p>

    <!-- ==================== -->
    <!-- Part選択 -->
    <!-- ==================== -->

    <div class="part-buttons">

        <button
            class="part-button"
            data-start="1"
            data-end="400"
        >
            Part 1
        </button>

        <button
            class="part-button"
            data-start="401"
            data-end="1000"
        >
            Part 2
        </button>

        <button
            class="part-button"
            data-start="1001"
            data-end="1400"
        >
            Part 3
        </button>

        <button
            class="part-button"
            data-start="1401"
            data-end="2000"
        >
            Part 4
        </button>

        <button
            class="part-button"
            data-start="2001"
            data-end="2300"
        >
            ＋α
        </button>

    </div>


    <!-- ==================== -->
    <!-- 範囲入力 -->
    <!-- ==================== -->

    <div class="range-settings">

        <div class="setting-row">

            <label for="setting-start-id">
                開始番号
            </label>

            <input
                type="number"
                id="setting-start-id"
                value="1"
                min="1"
                max="2300"
            >

        </div>


        <div class="setting-row">

            <label for="setting-end-id">
                終了番号
            </label>

            <input
                type="number"
                id="setting-end-id"
                value="100"
                min="1"
                max="2300"
            >

        </div>

    </div>


    <!-- ==================== -->
    <!-- 問題数 -->
    <!-- ==================== -->

    <div class="question-setting">

        <label for="setting-question-count">
            問題数
        </label>

        <div class="question-count-input">

            <input
                type="number"
                id="setting-question-count"
                value="10"
                min="1"
                max="100"
            >

            <span>問</span>

        </div>

    </div>


    <br>


    <!-- ==================== -->
    <!-- ボタン -->
    <!-- ==================== -->

    <button id="settings-start-button">
        START
    </button>

    <button id="settings-back-button">
        戻る
    </button>

</div>


        <!-- ==================== -->
        <!-- クイズ画面 -->
        <!-- ==================== -->

        <div id="quiz-screen" class="quiz-box" style="display: none;">

    <div class="quiz-content">

        <p id="progress">1 / 10</p>

        <div class="question-area">
            <p>この単語の意味は？</p>
            <h2 id="question">---</h2>
        </div>

        <div class="choices">

            <button class="choice"></button>
            <button class="choice"></button>
            <button class="choice"></button>
            <button class="choice"></button>

        </div>

    </div>

</div>

        <!-- ==================== -->
        <!-- 結果画面 -->
        <!-- ==================== -->

        <div id="result-screen" class="quiz-box" style="display: none;">

            <h2>QUIZ COMPLETE!</h2>

            <p>あなたの結果</p>


            <!-- 点数 -->

            <h3 id="score">
                0 / 10
            </h3>


            <!-- 正答率 -->

            <p id="percentage">
                正答率 0%
            </p>


            <!-- もう一度 -->

            <button id="retry-button">
                もう一度挑戦
            </button>

        </div>

        <!-- ==================== -->
<!-- STATUS画面 -->
<!-- ==================== -->

<div id="status-screen" class="quiz-box" style="display: none;">

    <h2>LEAP STATUS</h2>


    <!-- 学習した単語 -->

    <p>学習した単語</p>

    <h3 id="studied-count">
        0 / 2300語
    </h3>


    <!-- 全体の正答率 -->

    <p>全体の正答率</p>

    <h3 id="overall-accuracy">
        0%
    </h3>


    <!-- ==================== -->
    <!-- 苦手単語 -->
    <!-- ==================== -->

    <hr>

    <h3>🔴 苦手な単語</h3>

    <div id="weak-words">
        まだデータがありません。
    </div>


    <!-- ==================== -->
    <!-- 得意単語 -->
    <!-- ==================== -->

    <hr>

    <h3>🟢 得意な単語</h3>

    <div id="strong-words">
        まだデータがありません。
    </div>


    <br>

    <button id="status-back-button">
        戻る
    </button>

</div>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>
</html>
