<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LEAP QUIZ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- ==================== -->
        <!-- タイトル -->
        <!-- ==================== -->

        <h1>LEAP QUIZ</h1>


        <!-- ==================== -->
        <!-- ロード画面 -->
        <!-- ==================== -->

        <div id="loading-screen" class="quiz-box">

            <h2>Loading...</h2>

            <p>単語データを読み込んでいます</p>

        </div>


        <!-- ==================== -->
<!-- HOME画面 -->
<!-- ==================== -->

<div id="home-screen" class="quiz-box" style="display: none;">

    <h2>HOME</h2>

    <p>教材を選択してください</p>

    <button id="leap-button">
        LEAP
    </button>

</div>


        <!-- ==================== -->
        <!-- クイズ画面 -->
        <!-- ==================== -->

        <div id="quiz-screen" class="quiz-box" style="display: none;">

    <div class="quiz-content">

        <p id="progress">1 / 10</p>

        <div class="question-area">
            <p>この単語の意味は？</p>
            <h2 id="question">---</h2>
        </div>

        <div class="choices">

            <button class="choice"></button>
            <button class="choice"></button>
            <button class="choice"></button>
            <button class="choice"></button>

        </div>

    </div>

</div>

        <!-- ==================== -->
        <!-- 結果画面 -->
        <!-- ==================== -->

        <div id="result-screen" class="quiz-box" style="display: none;">

            <h2>QUIZ COMPLETE!</h2>

            <p>あなたの結果</p>


            <!-- 点数 -->

            <h3 id="score">
                0 / 10
            </h3>


            <!-- 正答率 -->

            <p id="percentage">
                正答率 0%
            </p>


            <!-- もう一度 -->

            <button id="retry-button">
                もう一度挑戦
            </button>

        </div>

        <div id="status-screen" class="quiz-box" style="display: none;">

    <h2>学習状況</h2>

    <p>学習した単語</p>
    <h3 id="studied-count">0語</h3>

    <p>全体の正答率</p>
    <h3 id="overall-accuracy">0%</h3>

    <button id="status-back-button">
        戻る
    </button>

</div>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>
</html>
